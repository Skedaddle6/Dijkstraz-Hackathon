<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HamroChimeki - Community Safety</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body>
    <div class="app-container">
        <header>
            <div class="logo">HamroChimeki</div>
            <div class="user-status">
                <span id="connection-status" class="status-indicator"></span>
                <span id="user-info">Guest</span>
            </div>
        </header>

        <main>
            <div id="map"></div>

            <div class="sidebar">
                <div class="tabs">
                    <button class="tab-btn active" data-tab="alerts">Alerts</button>
                    <button class="tab-btn" data-tab="circles">Circles</button>
                </div>

                <div id="alerts-feed" class="feed-container">
                    <!-- Alerts will be injected here -->
                    <div class="empty-state">No recent alerts in your area.</div>
                </div>
            </div>
        </main>

        <button id="sos-btn" class="sos-button">
            <span>SOS</span>
        </button>
    </div>

    <!-- Incident Modal -->
    <div id="incident-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Report Incident</h2>
            <form id="incident-form">
                <select id="incident-type" required>
                    <option value="theft">Theft/Robbery</option>
                    <option value="fire">Fire</option>
                    <option value="medical">Medical Emergency</option>
                    <option value="accident">Road Accident</option>
                    <option value="suspicious">Suspicious Activity</option>
                    <option value="other">Other</option>
                </select>
                <input type="text" id="incident-title" placeholder="Title" required>
                <textarea id="incident-desc" placeholder="Description" required></textarea>
                <label>
                    <input type="checkbox" id="is-anonymous"> Report Anonymously
                </label>
                <div class="modal-actions">
                    <button type="button" id="cancel-report">Cancel</button>
                    <button type="submit" class="primary-btn">Report</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="/static/app.js"></script>
</body>

</html>
